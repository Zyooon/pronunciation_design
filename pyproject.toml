[project]
name = "pronunciation-design"
version = "0.1.0"
description = "Korean pronunciation scoring MVP for English learners using MFCC, ZCR, duration, RMS, and reference vectors."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "gradio>=4.44.0",
    "sounddevice>=0.5.5",
    "elevenlabs>=2.52.0",
    "python-dotenv>=1.2.2",
    "gtts>=2.5.4",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
